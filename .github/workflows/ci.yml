name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TF_IN_AUTOMATION: "true"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  python:
    name: Python lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint Python
        run: ruff check services tests scripts
      - name: Run unit tests
        run: pytest -m 'not integration'

  web:
    name: Build web console
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  terraform:
    name: Validate Terraform (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [local, aws]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  integration:
    name: Floci end-to-end integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install locked web dependencies
        run: npm ci --prefix web
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run integration against local Floci
        run: make integration PYTHON=python
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: build/integration-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove local services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
