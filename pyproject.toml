[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-media-pipeline"
version = "1.0.0"
description = "Event-driven video processing with observable recovery"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.40.61",
  "fastapi==0.146.0",
  "starlette==1.3.1",
  "mangum==0.19.0",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]
reports = ["matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.setuptools.package-data]
pipeline = ["assets/*.mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"]
markers = ["integration: requires the running local pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
